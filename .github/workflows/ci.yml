name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: VBScript structure lint
        run: python3 tools/vbs_lint.py
      - name: Bundle is up to date
        run: python3 tools/bundle.py --check
      - name: Tuning sim runs
        run: python3 tools/tune_sim.py --games 500

  rules-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rules tests (cscript)
        working-directory: tests
        shell: cmd
        run: cscript //nologo run_tests.wsf
